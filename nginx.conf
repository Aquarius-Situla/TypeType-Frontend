map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

upstream typetype_server_backend {
    zone typetype_server_backend 64k;
    server ${TYPETYPE_SERVER_HOST}:${TYPETYPE_SERVER_PORT} resolve;
}

upstream typetype_token_backend {
    zone typetype_token_backend 64k;
    server ${TYPETYPE_TOKEN_HOST}:${TYPETYPE_TOKEN_PORT} resolve;
}

upstream typetype_downloader_backend {
    zone typetype_downloader_backend 64k;
    server ${TYPETYPE_DOWNLOADER_HOST}:${TYPETYPE_DOWNLOADER_PORT} resolve;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2g;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /api/version {
        alias /usr/share/nginx/html/version.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location = /api/version/web {
        alias /usr/share/nginx/html/version-web.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location = /api/version/server {
        proxy_pass http://typetype_server_backend/version;
        add_header Cache-Control "no-cache";
    }

    location = /api/version/token {
        proxy_pass http://typetype_token_backend/version;
        add_header Cache-Control "no-cache";
    }

    location = /api/version/downloader {
        proxy_pass http://typetype_downloader_backend/version;
        add_header Cache-Control "no-cache";
    }

    location = /api/rss/feeds {
        access_log off;
        proxy_pass http://typetype_server_backend/rss/feeds;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30;
        proxy_send_timeout 30;
        proxy_buffering on;
    }

    location ^~ /api/rss/feeds/ {
        access_log off;
        proxy_pass http://typetype_server_backend/rss/feeds/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30;
        proxy_send_timeout 30;
        proxy_buffering on;
    }

    location ^~ /api/ {
        client_max_body_size 2g;
        proxy_pass http://typetype_server_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;
    }

    location ^~ /sabr/ {
        proxy_pass http://typetype_server_backend/sabr/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;
    }

    location ^~ /streams/ {
        proxy_pass http://typetype_server_backend/streams/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;
    }

    location = /proxy {
        proxy_pass http://typetype_server_backend/proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;
    }

    location ^~ /proxy/ {
        proxy_pass http://typetype_server_backend/proxy/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
