<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/app.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TypeType" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (() => {
        const STORAGE_KEY = "typed-theme";
        const DARK = "dark";
        const LIGHT = "light";
        const SYSTEM = "system";

        function readStoredTheme() {
          try {
            const raw = window.localStorage.getItem(STORAGE_KEY);
            if (!raw) return DARK;
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== "object") return DARK;
            const state = parsed.state;
            if (!state || typeof state !== "object") return DARK;
            const theme = state.theme;
            return theme === LIGHT || theme === DARK || theme === SYSTEM ? theme : DARK;
          } catch (_error) {
            return DARK;
          }
        }

        function resolveTheme(theme) {
          if (theme === SYSTEM) {
            return window.matchMedia?.("(prefers-color-scheme: dark)").matches
              ? DARK
              : LIGHT;
          }
          return theme === LIGHT ? LIGHT : DARK;
        }

        const theme = readStoredTheme();
        const resolved = resolveTheme(theme);
        const root = document.documentElement;
        root.dataset.theme = resolved;
        root.style.colorScheme = resolved;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", resolved === LIGHT ? "#f4f4f5" : "#09090b");
        }
      })();
    </script>
    <script>
      (() => {
        try {
          if (location.pathname !== "/watch" || localStorage.getItem("typed-auth")) return;
          const v = (new URLSearchParams(location.search).get("v") || "").trim();
          const bilibili = v.match(/^(BV[A-Za-z0-9]{10})(?:\?p=(\d+))?$/i);
          let provider = "niconico";
          let source = `https://www.nicovideo.jp/watch/${v}`;
          if (bilibili) {
            const page = Number(bilibili[2] || "1");
            const suffix = Number.isSafeInteger(page) && page > 1 ? `?p=${page}` : "";
            provider = "bilibili";
            source = `https://www.bilibili.com/video/${bilibili[1]}${suffix}`;
          } else if (!/^(sm|nm|so)\d+$/i.test(v)) {
            return;
          }
          const configured = "%VITE_API_URL%";
          const api = configured.startsWith("%") ? "/api" : configured;
          const endpoint = `${api}/streams/${provider}?url=${encodeURIComponent(source)}`;
          window.__typetypeEarlyStream = { endpoint, response: fetch(endpoint, { cache: "no-store" }) };
        } catch (_error) {}
      })();
    </script>
    <title>TypeType</title>
    <style>
      .vds-quality-menu > .vds-menu-item,
      .vds-quality-menu > .vds-menu-items { order: 0; }
      .vds-format-menu > .vds-menu-item,
      .vds-format-menu > .vds-menu-items { order: 1; }
      .vds-audio-menu > .vds-menu-item,
      .vds-audio-menu > .vds-menu-items { order: 2; }
      .vds-speed-menu > .vds-menu-item,
      .vds-speed-menu > .vds-menu-items,
      .vds-loop-menu > .vds-menu-item { order: 3; }
      .vds-accessibility-menu > .vds-menu-item,
      .vds-accessibility-menu > .vds-menu-items { order: 4; }
      .vds-captions-menu > .vds-menu-item,
      .vds-captions-menu > .vds-menu-items { order: 5; }
    </style>
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        background: #09090b;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      html[data-theme="light"] #app-loader {
        background: var(--color-app, #fafafa);
      }
      .loading-mascot {
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <img id="app-loader-gif" class="loading-mascot" width="160" height="160" alt="" />
    </div>
    <script>
      // Same list as `loading` in src/lib/reaction-gifs.ts: one of them is drawn at each start.
      {
        const gifs = ["/loader-mascot.gif", "/reactions/loading-1.webp", "/reactions/loading-2.webp"];
        const img = document.getElementById("app-loader-gif");
        if (img) img.src = gifs[Math.floor(Math.random() * gifs.length)];
      }
    </script>
    <script>
      if (window.location.pathname === "/hide-everything") {
        document.getElementById("app-loader")?.remove();
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
